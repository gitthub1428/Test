
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizPilot Launcher</title>
</head>
<body>
<h2>QuizPilot</h2>
<p>Generate your console launcher for permitted practice quizzes.</p>
<button id="generate">Generate launcher</button>
<button id="copy">Copy launcher</button>
<pre id="status">Ready</pre>

<script>
// =======================================
// QUIZPILOT CONFIGURATION
// =======================================

const NVIDIA_API_KEY = "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";
const NVIDIA_MODEL = ""; // Optional: enter a compatible model ID

// =======================================
// PRACTICE QUIZ ANALYSIS SCRIPT
// =======================================

const PRACTICE_SCRIPT = String.raw`
(async () => {
"use strict";

const log = (...x) => console.log("[QuizPilot]", ...x);
const clean = s => (s || "").replace(/\s+/g, " ").trim();

log("Starting...");

if (typeof CONFIG === "undefined") {
  log("Launcher configuration missing.");
  return;
}

const groups = new Map();

document.querySelectorAll(
  'input[type="radio"], input[type="checkbox"]'
).forEach(el => {
  if (!el.name) return;
  if (!groups.has(el.name)) groups.set(el.name, []);
  groups.get(el.name).push(el);
});

const questions = [];
let index = 0;

for (const [, elements] of groups) {
  if (elements.length < 2) continue;

  const parent = elements[0].closest(
    "fieldset, li, [role=group], .question, .form-group"
  ) || elements[0].parentElement?.parentElement;

  if (!parent) continue;

  const options = elements.map(el => {
    const label = el.labels?.[0];
    return clean(label?.innerText || el.value);
  }).filter(Boolean);

  const question = clean(parent.innerText);

  if (!question || !options.length) continue;

  questions.push({
    id: "q" + (++index),
    question,
    options
  });
}

if (!questions.length) {
  log("No supported question groups found.");
  return;
}

log("Detected", questions.length, "questions.");

try {
  let model = CONFIG.model;

  if (!model) {
    const modelsResponse = await fetch(
      "https://integrate.api.nvidia.com/v1/models",
      {
        headers: {
          Authorization: "Bearer " + CONFIG.key
        }
      }
    );

    if (!modelsResponse.ok) {
      throw Error("NVIDIA model discovery failed: " +
        modelsResponse.status);
    }

    const modelsData = await modelsResponse.json();

    const available = (modelsData.data || []).filter(m =>
      m.id && !/embed|rerank|guard|vision|audio|image/i.test(m.id)
    );

    if (!available.length) throw Error("No candidate models found.");

    model = available[0].id;
  }

  log("Selected model:", model);
  log("Analyzing practice questions...");

  const response = await fetch(
    "https://integrate.api.nvidia.com/v1/chat/completions",
    {
      method: "POST",
      headers: {
        Authorization: "Bearer " + CONFIG.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model,
        temperature: 0.1,
        messages: [
          {
            role: "system",
            content:
              "You are an educational practice assistant. " +
              "Analyze the questions and options. Return JSON only: " +
              '{"answers":[{"id":"q1","answer":"B",' +
              '"explanation":"...","confidence":0.95}]}. ' +
              "Do not invent options. Mark uncertainty honestly."
          },
          {
            role: "user",
            content: JSON.stringify(questions)
          }
        ]
      })
    }
  );

  if (!response.ok) {
    throw Error("NVIDIA request failed: " + response.status +
      " " + (await response.text()).slice(0, 300));
  }

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content;

  if (!content) throw Error("Empty AI response.");

  const jsonText = content
    .replace(/^\s*```(?:json)?/i, "")
    .replace(/```\s*$/, "")
    .trim();

  const result = JSON.parse(jsonText);

  console.group("[QuizPilot] Practice results");

  for (const item of result.answers || []) {
    console.group(item.id);
    log("Answer:", item.answer);
    log("Confidence:", item.confidence);
    log("Explanation:", item.explanation);
    console.groupEnd();
  }

  console.groupEnd();

  const output = JSON.stringify(result, null, 2);

  try {
    await navigator.clipboard.writeText(output);
    log("Results copied to clipboard.");
  } catch {
    log("Clipboard unavailable. Results:", output);
  }

  log("Analysis completed.");

} catch (error) {
  console.error("[QuizPilot] Error:", error);
}
})();
`;

let launcher = "";

document.getElementById("generate").onclick = () => {
  if (
    !NVIDIA_API_KEY ||
    NVIDIA_API_KEY === "PASTE_YOUR_NVIDIA_API_KEY_HERE"
  ) {
    document.getElementById("status").textContent =
      "Add your NVIDIA API key in the HTML first.";
    return;
  }

  const config = JSON.stringify({
    key: NVIDIA_API_KEY,
    model: NVIDIA_MODEL
  });

  const script = PRACTICE_SCRIPT.replace(
    'if (typeof CONFIG === "undefined") {',
    'const CONFIG = ' + config + ';\nif (typeof CONFIG === "undefined") {'
  );

  launcher =
    "eval(decodeURIComponent('" +
    encodeURIComponent(script) +
    "'))";

  document.getElementById("status").textContent =
    "Launcher generated. Click Copy launcher.";
};

document.getElementById("copy").onclick = async () => {
  if (!launcher) {
    document.getElementById("status").textContent =
      "Generate the launcher first.";
    return;
  }

  try {
    await navigator.clipboard.writeText(launcher);
    document.getElementById("status").textContent =
      "Copied. Paste into Console on a permitted practice page.";
  } catch {
    document.getElementById("status").textContent =
      "Clipboard permission denied.";
  }
};
</script>
</body>
</html>
