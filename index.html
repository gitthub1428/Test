<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Document Scanner</title>
  
  <style>
    :root {
      --bg-dark: #090a0f;
      --surface-glass: rgba(18, 22, 34, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #00e676;
      --accent-amber: #ffab00;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .view-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .view-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .view-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #start-view {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090a0f 100%);
      padding: 24px;
      text-align: center;
      z-index: 50;
    }

    .hero-badge {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 242, 254, 0.3);
    }

    .hero-badge svg {
      width: 44px;
      height: 44px;
      stroke: #fff;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .hero-desc {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #001220;
      font-weight: 600;
      font-size: 16px;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    #scanner-view {
      background: #000;
      z-index: 10;
    }

    #video-feed {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 12;
    }

    .scanner-ui {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px) 16px;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding-top: 8px;
    }

    .glass-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .glass-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .glass-btn.btn-disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .status-hud {
      margin-top: 14px;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 88%;
    }

    .status-pill {
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .progress-bar-container {
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-green);
      transition: width 0.05s linear;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding-bottom: 12px;
    }

    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: transparent;
      border: 4px solid #fff;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-btn-inner {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active .shutter-btn-inner {
      transform: scale(0.9);
      background: #e2e8f0;
    }

    #capture-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.1s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    #preview-view {
      background: var(--bg-dark);
      z-index: 30;
      padding: 20px;
      justify-content: space-between;
    }

    .preview-canvas-wrapper {
      flex: 1;
      width: 100%;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
    }

    #preview-canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-glass);
      object-fit: contain;
    }

    .preview-actions {
      width: 100%;
      display: flex;
      gap: 12px;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    .btn-secondary {
      flex: 1;
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action-accent {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #001220;
      border: none;
    }

    #toast-msg {
      position: absolute;
      top: 24px;
      background: rgba(220, 38, 38, 0.95);
      color: white;
      padding: 12px 20px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 100;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
      line-height: 1.4;
    }

    #toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="toast-msg"></div>
  <div id="capture-flash"></div>

  <!-- VIEW 1: START SCREEN -->
  <div id="start-view" class="view-layer view-active">
    <div class="hero-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
      </svg>
    </div>
    <h1 class="hero-title">Smart Scanner</h1>
    <p class="hero-desc">Point your camera at documents, receipts, or notes to scan with live border tracking.</p>
    <button id="btn-start" class="btn-primary">
      <span>Start Scanning</span>
    </button>
  </div>

  <!-- VIEW 2: CAMERA SCREEN -->
  <div id="scanner-view" class="view-layer view-hidden">
    <video id="video-feed" playsinline muted autoplay></video>
    <canvas id="overlay-canvas"></canvas>

    <div class="scanner-ui">
      <div class="top-bar">
        <button id="btn-exit" class="glass-btn interactive" title="Exit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>

        <div class="status-hud">
          <div id="status-pill" class="status-pill">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Find a document</span>
          </div>
          <div id="progress-container" class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
          </div>
        </div>

        <button id="btn-torch" class="glass-btn interactive" title="Flashlight">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </button>
      </div>

      <div class="bottom-bar">
        <button id="btn-switch-cam" class="glass-btn interactive" title="Switch Camera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16v5h-5M4 8V3h5m11 0l-6 6M4 21l6-6"/></svg>
        </button>

        <button id="btn-manual-capture" class="shutter-btn interactive" title="Capture">
          <div class="shutter-btn-inner"></div>
        </button>

        <div style="width: 44px; height: 44px;"></div>
      </div>
    </div>
  </div>

  <!-- VIEW 3: PREVIEW SCREEN -->
  <div id="preview-view" class="view-layer view-hidden">
    <div class="preview-canvas-wrapper">
      <canvas id="preview-canvas"></canvas>
    </div>
    <div class="preview-actions">
      <button id="btn-retake" class="btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        Retake
      </button>
      <button id="btn-use-photo" class="btn-secondary btn-action-accent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        Use Photo
      </button>
    </div>
  </div>
</div>

<canvas id="analysis-canvas" style="display: none;"></canvas>
<canvas id="capture-canvas" style="display: none;"></canvas>

<script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>

<script>
const CAMERA_FPS_LIMIT = 15;
const MIN_DOCUMENT_AREA = 0.15;
const MAX_DOCUMENT_AREA = 0.92;
const CENTER_TOLERANCE = 0.15;
const MAX_PERSPECTIVE = 0.30;
const MIN_CONFIDENCE = 85;
const HYSTERESIS_CONFIDENCE = 78;
const STABILITY_THRESHOLD = 0.005;
const STABILITY_FRAMES = 8;
const AUTO_CAPTURE_DELAY = 750;
const GLARE_THRESHOLD = 0.20;
const LOW_LIGHT_THRESHOLD = 45;
const OVEREXPOSURE_THRESHOLD = 225;
const ANALYSIS_TARGET_WIDTH = 480;

let cameraStream = null;
let videoTrack = null;
let currentCameraIndex = 0;
let availableCameras = [];
let isDetecting = false;
let captureInProgress = false;
let timerStartTime = null;

let previousCorners = null;
let trackingLostCounter = 0;
let consecutiveStableFrames = 0;
let recentDetectionHistory = [];
let rollingSharpnessWindow = [];
let recentFramesBuffer = [];
let animatedCorners = null;

const STATES = {
  SEARCHING: 'SEARCHING',
  DETECTED: 'DETECTED',
  POSITIONING: 'POSITIONING',
  STABILIZING: 'STABILIZING',
  READY: 'READY',
  CAPTURING: 'CAPTURING'
};
let currentState = STATES.SEARCHING;

const startView = document.getElementById('start-view');
const scannerView = document.getElementById('scanner-view');
const previewView = document.getElementById('preview-view');
const videoFeed = document.getElementById('video-feed');
const overlayCanvas = document.getElementById('overlay-canvas');
const overlayCtx = overlayCanvas.getContext('2d');
const analysisCanvas = document.getElementById('analysis-canvas');
const analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
const captureCanvas = document.getElementById('capture-canvas');
const captureCtx = captureCanvas.getContext('2d', { willReadFrequently: true });
const previewCanvas = document.getElementById('preview-canvas');
const previewCtx = previewCanvas.getContext('2d');
const statusPill = document.getElementById('status-pill');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const progressContainer = document.getElementById('progress-container');
const progressFill = document.getElementById('progress-fill');
const captureFlash = document.getElementById('capture-flash');
const toastMsg = document.getElementById('toast-msg');
const btnTorch = document.getElementById('btn-torch');
const btnSwitchCam = document.getElementById('btn-switch-cam');
const btnStart = document.getElementById('btn-start');

function showToast(msg) {
  toastMsg.textContent = msg;
  toastMsg.classList.add('show');
  setTimeout(() => toastMsg.classList.remove('show'), 4500);
}

function triggerHaptic() {
  if (navigator.vibrate) {
    try { navigator.vibrate(50); } catch(e){}
  }
}

/**
 * DIRECT PERMISSION & CAMERA INITIALIZATION
 * Directly invoked inside the user touch event to ensure the browser prompt pops up.
 */
async function requestCameraAccess(deviceId = null) {
  // 1. Insecure context validation
  if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    showToast("Camera blocked: Mobile browsers require HTTPS to trigger permission. Please use HTTPS.");
    return;
  }

  // 2. MediaDevices API support check
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast("Your browser does not support standard camera access.");
    return;
  }

  if (cameraStream) {
    stopCamera();
  }

  // Minimum required constraints to guarantee permission prompt fires without parameter errors
  const standardConstraints = {
    audio: false,
    video: deviceId 
      ? { deviceId: { exact: deviceId } } 
      : { 
          facingMode: { ideal: "environment" },
          width: { ideal: 1920, min: 1280 },
          height: { ideal: 1080, min: 720 }
        }
  };

  const simpleFallbackConstraints = {
    audio: false,
    video: { facingMode: "environment" }
  };

  try {
    try {
      // This line triggers the native permission prompt
      cameraStream = await navigator.mediaDevices.getUserMedia(standardConstraints);
    } catch (e) {
      // If hardware rejects complex dimensions, retry simple stream
      cameraStream = await navigator.mediaDevices.getUserMedia(simpleFallbackConstraints);
    }

    videoFeed.srcObject = cameraStream;
    
    // Explicit play invocation
    await videoFeed.play();

    videoTrack = cameraStream.getVideoTracks()[0];
    await getCameras();
    checkTorchSupport();

    resizeOverlay();
    window.addEventListener('resize', resizeOverlay);

    // Switch Views
    startView.className = 'view-layer view-hidden';
    previewView.className = 'view-layer view-hidden';
    scannerView.className = 'view-layer view-active';

    captureInProgress = false;
    isDetecting = true;
    requestAnimationFrame(detectionLoop);

  } catch (err) {
    console.error("Camera Error:", err);
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      showToast("Camera permission denied. Tap the lock icon in the browser address bar to allow camera access.");
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      showToast("No camera detected on this device.");
    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
      showToast("Camera is currently in use by another application.");
    } else {
      showToast("Could not start camera: " + (err.message || "Unknown error"));
    }
  }
}

function stopCamera() {
  isDetecting = false;
  window.removeEventListener('resize', resizeOverlay);
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
    videoTrack = null;
  }
}

async function getCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    availableCameras = devices.filter(d => d.kind === 'videoinput');
    btnSwitchCam.classList.toggle('btn-disabled', availableCameras.length <= 1);
  } catch (err) {
    btnSwitchCam.classList.add('btn-disabled');
  }
}

async function checkTorchSupport() {
  if (!videoTrack) return;
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    btnTorch.classList.toggle('btn-disabled', !caps.torch);
  } catch(e) {
    btnTorch.classList.add('btn-disabled');
  }
}

let torchActive = false;
async function toggleTorch() {
  if (!videoTrack) return;
  try {
    torchActive = !torchActive;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
    btnTorch.style.color = torchActive ? 'var(--accent-amber)' : '#fff';
  } catch (e) {
    btnTorch.classList.add('btn-disabled');
  }
}

async function switchCamera() {
  if (availableCameras.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
  await requestCameraAccess(availableCameras[currentCameraIndex].deviceId);
}

function resizeOverlay() {
  if (!videoFeed.videoWidth) return;
  overlayCanvas.width = window.innerWidth;
  overlayCanvas.height = window.innerHeight;
}

function distance(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function orderPoints(pts) {
  const sorted = [...pts].sort((a, b) => a.y - b.y);
  const top = [sorted[0], sorted[1]].sort((a, b) => a.x - b.x);
  const bottom = [sorted[2], sorted[3]].sort((a, b) => a.x - b.x);
  return [top[0], top[1], bottom[1], bottom[0]];
}

function calculatePolygonArea(pts) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    area += pts[i].x * pts[j].y;
    area -= pts[j].x * pts[i].y;
  }
  return Math.abs(area) / 2;
}

function calculateInternalAngles(pts) {
  const angles = [];
  for (let i = 0; i < 4; i++) {
    const p1 = pts[(i + 3) % 4];
    const p2 = pts[i];
    const p3 = pts[(i + 1) % 4];
    const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
    const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
    const do
