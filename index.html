<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Smart Document Scanner</title>
<style>
:root{--bg:#050505;--fg:#fff;--muted:#b9b9b9;--glass:rgba(20,20,20,.72);--line:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:fixed;inset:0;background:#000}
#video{position:absolute;width:100%;height:100%;object-fit:cover;background:#000}
#analysis{display:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;z-index:5}
.pill{padding:9px 13px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);font-size:13px;font-weight:650;box-shadow:0 6px 30px #0008}
.icon{width:42px;height:42px;border:0;border-radius:50%;background:var(--glass);color:#fff;font-size:18px;backdrop-filter:blur(16px)}
.bottom{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));z-index:6;padding:15px 20px}
.status{text-align:center;min-height:46px;margin-bottom:12px}
#message{font-size:16px;font-weight:700;text-shadow:0 2px 12px #000}
#sub{font-size:12px;color:#ddd;margin-top:4px}
.controls{display:flex;align-items:center;justify-content:center;gap:24px}
.capture{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#fff8;box-shadow:0 0 0 7px #0006}
.capture:active{transform:scale(.94)}
.small{width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);color:#fff;font-size:19px;backdrop-filter:blur(15px)}
#start,#result{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,#222,#030303 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#result{display:none;z-index:30}
.card{width:min(440px,92vw);display:flex;flex-direction:column;align-items:center;gap:15px}
.logo{width:76px;height:76px;border-radius:24px;background:#fff;color:#111;display:grid;place-items:center;font-size:35px;box-shadow:0 20px 60px #000}
h1{font-size:28px;margin:4px 0 0;letter-spacing:-.8px}
p{color:var(--muted);line-height:1.5;margin:0 0 10px}
.primary{width:100%;border:0;border-radius:18px;padding:16px;background:#fff;color:#000;font-weight:800;font-size:16px}
.secondary{width:100%;border:1px solid #ffffff33;border-radius:18px;padding:15px;background:#ffffff0d;color:#fff;font-weight:700;font-size:15px}
#resultImg{max-width:94vw;max-height:67vh;border-radius:12px;box-shadow:0 20px 70px #000}
.hidden{display:none!important}
.flash{animation:flash .25s ease}
@keyframes flash{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
@media (orientation:landscape){.bottom{padding-bottom:15px}.status{margin-bottom:5px}}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="analysis"></canvas>
  <canvas id="overlay"></canvas>

  <div class="top">
    <button class="icon" id="exitBtn" aria-label="Exit">×</button>
    <div class="pill" id="state">Ready</div>
    <button class="icon" id="torchBtn" aria-label="Torch">⌁</button>
  </div>

  <div class="bottom">
    <div class="status">
      <div id="message">Find a document</div>
      <div id="sub">Place the whole page inside the camera</div>
    </div>
    <div class="controls">
      <button class="small" id="switchBtn" aria-label="Switch camera">↻</button>
      <button class="capture" id="captureBtn" aria-label="Capture"></button>
      <button class="small" id="resetBtn" aria-label="Reset">↺</button>
    </div>
  </div>

  <section id="start">
    <div class="card">
      <div class="logo">▣</div>
      <h1>Smart Scanner</h1>
      <p>Point your camera at a document. The scanner detects its corners, checks image quality and captures automatically when everything is ready.</p>
      <div style="font-size:12px;color:#aaa;margin:-4px 0 4px">Camera permission is requested when you tap Start Scanning.</div>
      <button class="primary" id="startBtn">Start Scanning</button>
    </div>
  </section>

  <section id="result">
    <div class="card">
      <div class="pill">Captured</div>
      <img id="resultImg" alt="Captured document">
      <button class="primary" id="useBtn">Use Photo</button>
      <button class="secondary" id="retakeBtn">Retake</button>
    </div>
  </section>
</div>

<!-- OpenCV is loaded only for computer vision. The application itself is one HTML file. -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
"use strict";

/* =========================
   CENTRALIZED TUNING VALUES
   ========================= */
const CFG = {
  targetWidth: 1920,
  targetHeight: 1080,
  detectFPS: 12,
  minAreaRatio: .15,
  maxAreaRatio: .92,
  preferredMinArea: .25,
  preferredMaxArea: .85,
  cannyLow: 50,
  cannyHigh: 150,
  blurKernel: 5,
  approxEpsilon: .02,
  minAngle: 20,
  maxAngle: 160,
  centerTolerance: .15,
  maxPerspective: .30,
  minConfidence: 85,
  readyDropConfidence: 78,
  stableMovement: .005,
  movingMovement: .015,
  requiredStableFrames: 8,
  temporalValidNeeded: 5,
  temporalWindow: 8,
  autoCaptureMs: 750,
  captureLockMs: 1500,
  lostFrames: 3,
  glareWarn: .12,
  glareReject: .20,
  lowLight: 45,
  highLight: 225,
  clippingRatio: .08,
  sharpRelativeMin: .55,
  sharpExcellent: .80,
  edgeSupportMin: .70,
  frameKeep: 5,
  duplicateResetMs: 1500
};

const video = document.getElementById("video");
const analysis = document.getElementById("analysis");
const overlay = document.getElementById("overlay");
const actx = analysis.getContext("2d", {willReadFrequently:true});
const octx = overlay.getContext("2d");
const start = document.getElementById("start");
const result = document.getElementById("result");
const resultImg = document.getElementById("resultImg");
const message = document.getElementById("message");
const sub = document.getElementById("sub");
const stateEl = document.getElementById("state");
const torchBtn = document.getElementById("torchBtn");

let stream=null, track=null, facing="environment", torch=false;
let running=false, processing=false, captureInProgress=false;
let raf=0, lastDetect=0, stableCount=0, invalidCount=0, readySince=0;
let lastQuad=null, bestFrames=[], rollingSharp=[];
let capturedCanvas=null, cvReady=false, cvFailed=false;

const sleep = ms => new Promise(r=>setTimeout(r,ms));
function setStatus(s,m,detail=""){ stateEl.textContent=s; message.textContent=m; sub.textContent=detail; }
function resizeOverlay(){ overlay.width=innerWidth*devicePixelRatio; overlay.height=innerHeight*devicePixelRatio; overlay.style.width=innerWidth+"px";overlay.style.height=innerHeight+"px";octx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize",resizeOverlay); resizeOverlay();

if(window.cv){
  cv["onRuntimeInitialized"]=()=>{cvReady=true;};
}
function cameraError(e){
  let text="Camera could not be started.";
  if(e && e.name==="NotAllowedError") text="Camera permission was denied.";
  else if(e && e.name==="NotFoundError") text="No camera was found.";
  setStatus("Camera error",text,"Check browser permissions and try again.");
}

async function startCamera(){
  const secure = window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if(!secure){
    setStatus("Camera blocked","Secure connection required","Open this page through HTTPS or localhost");
    alert("Camera access requires HTTPS or localhost. Opening an HTML file directly as file:// may prevent Android from showing the permission prompt.");
    return;
  }
  if(!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia!=="function"){
    setStatus("Unsupported","Camera API unavailable","Use a recent Chrome/Android browser");
    return;
  }

  try{
    stopCamera();
    resetDetection();

    // First request permission explicitly with the rear camera.
    // Do not rely on enumerateDevices labels before permission is granted.
    const constraints={
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:CFG.targetWidth},
        height:{ideal:CFG.targetHeight},
        frameRate:{ideal:30,max:60}
      }
    };

    setStatus("CAMERA","Requesting camera…","Allow camera access when Android asks");
    stream=await navigator.mediaDevices.getUserMedia(constraints);

    video.srcObject=stream;

    // Wait for metadata before starting analysis.
    await new Promise((resolve,reject)=>{
      if(video.readyState>=1 && video.videoWidth>0){resolve();return;}
      const timer=setTimeout(()=>reject(new Error("Camera metadata timeout")),8000);
      video.onloadedmetadata=()=>{
        clearTimeout(timer);
        if(video.videoWidth>0)resolve();
        else reject(new Error("Camera returned no video dimensions"));
      };
    });

    await video.play();

    track=stream.getVideoTracks()[0];
    if(!track){
      throw new Error("No video track returned");
    }

    // Read actual camera capabilities/settings after permission.
    try{
      const settings=track.getSettings ? track.getSettings() : {};
      console.info("Camera settings:",settings);
    }catch(e){}

    const caps=track.getCapabilities ? track.getCapabilities() : {};
    if(caps.torch){
      torchBtn.classList.remove("hidden");
      torchBtn.textContent="⌁";
    }else{
      torchBtn.classList.add("hidden");
    }

    // If supported, improve camera behavior without making startup fail.
    try{
      const advanced={};
      if(caps.focusMode && caps.focusMode.includes("continuous")) advanced.focusMode="continuous";
      if(caps.exposureMode && caps.exposureMode.includes("continuous")) advanced.exposureMode="continuous";
      if(caps.whiteBalanceMode && caps.whiteBalanceMode.includes("continuous")) advanced.whiteBalanceMode="continuous";
      if(Object.keys(advanced).length) await track.applyConstraints({advanced:[advanced]});
    }catch(e){
      console.info("Optional camera constraints unavailable:",e);
    }

    running=true;
    start.classList.add("hidden");
    result.style.display="none";
    setStatus("SCANNING","Find a document","Place the whole page inside the camera");
    requestAnimationFrame(loop);

  }catch(e){
    console.error("Camera startup error:",e);
    stopCamera();

    if(e.name==="NotAllowedError" || e.name==="PermissionDeniedError"){
      setStatus("PERMISSION","Camera permission denied","Allow Camera in Android/browser settings, then try again");
    }else if(e.name==="NotFoundError" || e.name==="DevicesNotFoundError"){
      setStatus("NO CAMERA","No camera found","Check that your device camera is available");
    }else if(e.name==="NotReadableError" || e.name==="TrackStartError"){
      setStatus("CAMERA BUSY","Camera is unavailable","Close other apps using the camera and try again");
    }else if(e.name==="OverconstrainedError"){
      // Retry once with minimal constraints if the preferred camera settings fail.
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"environment"}});
        video.srcObject=stream;
        await video.play();
        track=stream.getVideoTracks()[0];
        running=true;
        start.classList.add("hidden");
        setStatus("SCANNING","Find a document","Camera started with compatible settings");
        requestAnimationFrame(loop);
      }catch(e2){
        console.error("Fallback camera error:",e2);
        setStatus("CAMERA ERROR","Camera settings unsupported","Try another browser or camera app");
      }
    }else if(e.name==="SecurityError"){
      setStatus("SECURITY","Camera access blocked","Use HTTPS or localhost");
    }else{
      setStatus("CAMERA ERROR","Could not start camera","Check browser permissions and try again");
    }
  }
}
function stopCamera(){
  running=false; if(raf)cancelAnimationFrame(raf); raf=0;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null;}
}
async function toggleTorch(){
  if(!track || !track.getCapabilities)return;
  const caps=track.getCapabilities();
  if(!caps.torch)return;
  torch=!torch;
  try{await track.applyConstraints({advanced:[{torch}]});torchBtn.textContent=torch?"●":"⌁";}
  catch(e){torch=false;}
}
async function switchCamera(){
  if(!running)return;
  facing=facing==="environment"?"user":"environment";
  torch=false;
  await startCamera();
}
function clearOverlay(){octx.clearRect(0,0,innerWidth,innerHeight);}
function videoPointToScreen(p){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh)return {x:0,y:0};
  const scale=Math.max(innerWidth/vw,innerHeight/vh);
  const dw=vw*scale, dh=vh*scale;
  const ox=(innerWidth-dw)/2, oy=(innerHeight-dh)/2;
  return {x:p.x*scale+ox,y:p.y*scale+oy};
}
function drawQuad(q,confidence){
  clearOverlay(); if(!q)return;
  const pts=q.map(videoPointToScreen);
  octx.save();
  octx.lineJoin="round"; octx.lineCap="round";
  octx.beginPath();octx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<4;i++)octx.lineTo(pts[i].x,pts[i].y);
  octx.closePath();
  octx.fillStyle="rgba(255,255,255,.06)";octx.fill();
  octx.strokeStyle="#fff";octx.lineWidth=3;octx.stroke();
  pts.forEach((p,i)=>{
    octx.beginPath();octx.arc(p.x,p.y,9,0,Math.PI*2);
    octx.fillStyle="#fff";octx.fill();
    octx.beginPath();octx.arc(p.x,p.y,15,0,Math.PI*2);
    octx.strokeStyle="rgba(255,255,255,.5)";octx.lineWidth=2;octx.stroke();
  });
  if(confidence>=CFG.minConfidence){
    const cx=pts.reduce((a,p)=>a+p.x,0)/4, cy=pts.reduce((a,p)=>a+p.y,0)/4;
    octx.beginPath();octx.arc(cx,cy,22,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,(confidence-85)/15));
    octx.strokeStyle="#fff";octx.lineWidth=3;octx.stroke();
  }
  octx.restore();
}
function orderPoints(pts){
  const sums=pts.map(p=>p.x+p.y), diffs=pts.map(p=>p.x-p.y);
  return [
    pts[sums.indexOf(Math.min(...sums))],
    pts[diffs.indexOf(Math.max(...diffs))],
    pts[sums.indexOf(Math.max(...sums))],
    pts[diffs.indexOf(Math.min(...diffs))]
  ];
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function polygonArea(p){
  let a=0; for(let i=0;i<4;i++){let j=(i+1)%4;a+=p[i].x*p[j].y-p[j].x*p[i].y;} return Math.abs(a)/2;
}
function angle(a,b,c){
  const ab={x:a.x-b.x,y:a.y-b.y}, cb={x:c.x-b.x,y:c.y-b.y};
  const dot=ab.x*cb.x+ab.y*cb.y, den=Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y);
  return Math.acos(Math.max(-1,Math.min(1,dot/(den||1))))*180/Math.PI;
}
function convexValid(q){
  for(let i=0;i<4;i++){
    const ang=angle(q[(i+3)%4],q[i],q[(i+1)%4]);
    if(ang<CFG.minAngle||ang>CFG.maxAngle)return false;
  }
  return true;
}
function perspectiveScore(q){
  const w1=dist(q[0],q[1]),w2=dist(q[3],q[2]);
  const h1=dist(q[0],q[3]),h2=dist(q[1],q[2]);
  const v=Math.max(Math.abs(w1-w2)/Math.max(w1,w2),Math.abs(h1-h2)/Math.max(h1,h2));
  return Math.min(1,v);
}
function edgeSupport(gray, q, w,h){
  let total=0, good=0;
  const samples=45;
  for(let e=0;e<4;e++){
    const a=q[e],b=q[(e+1)%4];
    for(let i=1;i<samples-1;i++){
      const t=i/(samples-1),x=Math.round(a.x+(b.x-a.x)*t),y=Math.round(a.y+(b.y-a.y)*t);
      total++;
      let found=false;
      for(let dy=-2;dy<=2&&!found;dy++)for(let dx=-2;dx<=2&&!found;dx++){
        const xx=x+dx,yy=y+dy;
        if(xx>=0&&yy>=0&&xx<w&&yy<h&&gray.ucharPtr(yy)[xx]>120)found=true;
      }
      if(found)good++;
    }
  }
  return total?good/total:0;
}
function frameMetrics(gray,q,w,h){
  const mask=new cv.Mat.zeros(h,w,cv.CV_8UC1);
  const poly=cv.matFromArray(4,1,cv.CV_32SC2,q.flatMap(p=>[Math.round(p.x),Math.round(p.y)]));
  const pp=new cv.MatVector();pp.push_back(poly);cv.fillPoly(mask,pp,new cv.Scalar(255));
  const mean=new cv.Mat(),sd=new cv.Mat();
  cv.meanStdDev(gray,mean,sd,mask);
  const brightness=mean.doubleAt(0,0);
  const pixels=gray.data, m=mask.data; let near=0,count=0;
  for(let i=0;i<m.length;i++)if(m[i]){count++;if(pixels[i]<10||pixels[i]>245)near++;}
  const lap=new cv.Mat();cv.Laplacian(gray,lap,cv.CV_64F);
  const lm=new cv.Mat(),ls=new cv.Mat();cv.meanStdDev(lap,lm,ls,mask);
  const sharp=Math.pow(ls.doubleAt(0,0),2);
  [mask,poly,pp,mean,sd,lap,lm,ls].forEach(x=>{try{x.delete()}catch(e){}});
  return {brightness,clipping:count?near/count:0,sharp};
}
function confidenceFor(q,metrics,w,h,edge){
  const area=polygonArea(q)/(w*h);
  const areaScore=area>=CFG.minAreaRatio&&area<=CFG.maxAreaRatio?10:0;
  const center={x:q.reduce((s,p)=>s+p.x,0)/4,y:q.reduce((s,p)=>s+p.y,0)/4};
  const centered=Math.abs(center.x-w/2)/(w*.5)<=CFG.centerTolerance&&Math.abs(center.y-h/2)/(h*.5)<=CFG.centerTolerance;
  const centerScore=centered?5:0;
  const ps=perspectiveScore(q), perspectiveScorePts=ps<=CFG.maxPerspective?10:Math.max(0,10*(1-ps/.5));
  const edgePts=Math.min(15,15*(edge/CFG.edgeSupportMin));
  const brightOK=metrics.brightness>=CFG.lowLight&&metrics.brightness<=CFG.highLight;
  const lightPts=brightOK?5:0;
  const clipPenalty=metrics.clipping>CFG.clippingRatio?5:0;
  return Math.max(0,Math.min(100,25+20+edgePts+areaScore+perspectiveScorePts+centerScore+lightPts-clipPenalty));
}
function detect(){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return null;
  const maxW=960, scale=Math.min(1,maxW/vw), w=Math.round(vw*scale),h=Math.round(vh*scale);
  analysis.width=w;analysis.height=h;actx.drawImage(video,0,0,w,h);
  if(!cvReady)return null;
  let src=cv.imread(analysis),gray=new cv.Mat(),blur=new cv.Mat(),edges=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(CFG.blurKernel,CFG.blurKernel),0);
  cv.Canny(blur,edges,CFG.cannyLow,CFG.cannyHigh);
  let contours=new cv.MatVector(),hier=new cv.Mat();cv.findContours(edges,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  let best=null,bestScore=-1;
  for(let i=0;i<contours.size();i++){
    const c=contours.get(i), peri=cv.arcLength(c,true), approx=new cv.Mat();
    cv.approxPolyDP(c,approx,CFG.approxEpsilon*peri,true);
    if(approx.rows===4&&cv.isContourConvex(approx)){
      const pts=[];for(let j=0;j<4;j++)pts.push({x:approx.intAt(j,0),y:approx.intAt(j,1)});
      const q=orderPoints(pts);
      if(!convexValid(q)){approx.delete();c.delete();continue;}
      const area=polygonArea(q)/(w*h);if(area<CFG.minAreaRatio||area>CFG.maxAreaRatio){approx.delete();c.delete();continue;}
      const edge=edgeSupport(edges,q,w,h), metrics=frameMetrics(gray,q,w,h);
      let score=confidenceFor(q,metrics,w,h,edge);
      if(area>=CFG.preferredMinArea&&area<=CFG.preferredMaxArea)score+=2;
      if(score>bestScore){bestScore=score;best={q:q.map(p=>({x:p.x/scale,y:p.y/scale})),score:Math.min(100,score),metrics,area,edge};}
    }
    approx.delete();c.delete();
  }
  [src,gray,blur,edges,contours,hier].forEach(x=>{try{x.delete()}catch(e){}});
  return best;
}
function movement(q){
  if(!lastQuad)return 0;
  const diag=Math.hypot(video.videoWidth,video.videoHeight);
  return q.reduce((s,p,i)=>s+dist(p,lastQuad[i]),0)/4/diag;
}
function sharpRelative(v){
  rollingSharp.push(v);if(rollingSharp.length>20)rollingSharp.shift();
  const sorted=[...rollingSharp].sort((a,b)=>a-b);
  const med=sorted[Math.floor(sorted.length/2)]||v;
  return med? v/med:1;
}
function conditionMessage(d,move){
  const w=video.videoWidth,h=video.videoHeight,q=d.q;
  const cx=q.reduce((s,p)=>s+p.x,0)/4,cy=q.reduce((s,p)=>s+p.y,0)/4;
  if(d.area<CFG.minAreaRatio)return["DETECTED","Move closer","Make the page larger in the frame"];
  if(d.area>CFG.maxAreaRatio)return["DETECTED","Move farther away","Keep all four corners visible"];
  if(Math.abs(cx-w/2)>.15*w||Math.abs(cy-h/2)>.15*h)return["POSITIONING","Center the document","Keep the page near the middle"];
  if(perspectiveScore(q)>CFG.maxPerspective)return["POSITIONING","Reduce the angle","Point the came
